<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Knights Acquisitions — Admin</title>
  </head>
  <body>
    <div class="drag-region">
      <div class="window-controls">
        <button class="win-btn win-minimize" id="btn-minimize" title="Minimize">
          <svg viewBox="0 0 10 1" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="win-btn win-maximize" id="btn-maximize" title="Maximize">
          <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor"/></svg>
        </button>
        <button class="win-btn win-close" id="btn-close" title="Close">
          <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </div>

    <main class="admin-main">
      <div class="admin-header">
        <div class="admin-header-left">
          <h1>User Management</h1>
          <p>All registered accounts on this device.</p>
        </div>
        <button class="btn-secondary" id="back-btn">← Back to Vault</button>
      </div>

      <div id="admin-message" class="form-message hidden"></div>

      <div class="user-table-wrap">
        <table class="user-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr class="table-placeholder">
              <td colspan="4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="scripts/admin.js"></script>
    <script src="scripts/titlebar.js"></script>
  </body>
</html>
